<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAMI Branding</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: transparent;
        }
        .sami-logo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }
        img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
    </style>
</head>
<body>
    <div class="sami-logo-container">
        <img src="/assets/img/logo.png" alt="SAMI Logo" />
    </div>
</body>
</html>
